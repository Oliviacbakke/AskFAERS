tests.yml
name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tests use synthetic data and a scripted stand-in for the API, so no key, data or extra packages are needed.
      - name: Run tests
        run: python3 -I -m unittest discover -s tests
